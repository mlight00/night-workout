<!doctype html>
<meta charset="utf-8">
<title>앱 화면 검수</title>
<style>body{margin:0;background:#333}iframe{border:0;display:block}</style>
<iframe id="f"></iframe>
<script>
  // 사용법: appshot.html?scene=rest&w=412&h=860  (헤드리스 크롬 스크린샷용)
  const q = new URLSearchParams(location.search), scene = q.get('scene') || 'home';
  const f = document.getElementById('f');
  f.width = q.get('w') || 412; f.height = q.get('h') || 860;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  f.src = '../index.html?speed=' + (q.get('speed') || 1);
  f.onload = async () => {
    const d = f.contentDocument, $ = (id) => d.getElementById(id), w = f.contentWindow;
    await wait(300);
    if (scene === 'home') return;
    if (scene === 'posture') { $('toPosture').click(); await wait(2500); return; }
    if (scene === 'records') { $('toRecords').click(); return; }
    if (scene === 'bike' && $('btnSwap').textContent.includes('자전거')) $('btnSwap').click();
    $('btnStart').click();
    if (scene === 'cond') return;
    d.querySelector('#condBody [data-c="good"]').click();
    const until = { warm: '어깨', rest: '휴식', work: '데드행 · 2세트', bike: '목표 구간', end: null }[scene];
    for (let i = 0; i < 4000; i++) {
      if (scene === 'end' ? d.getElementById('screen-end').classList.contains('is-active') : $('wTitle').textContent.includes(until)) break;
      await wait(25);
    }
    const t = w.performance.now();
    w.performance.now = () => t; // 그 순간에서 타이머를 멈춰 둔다 (3D 애니메이션은 계속)
  };
</script>
